<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wely Playground</title>
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
  <script>
    var t = localStorage.getItem('wely-playground-theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.setAttribute('data-theme', 'dark');
  </script>
  <style>
    :root {
      --wp-bg: #fafafa;
      --wp-fg: #18181b;
      --wp-muted: #71717a;
      --wp-subtle: #a1a1aa;
      --wp-border: #e4e4e7;
      --wp-surface: #ffffff;
      --wp-surface2: #f4f4f5;
      --wp-surface3: #fafafa;
      --wp-accent: #d97706;
      --wp-accent2: #f59e0b;
      --wp-ring: rgba(245,158,11,0.35);
    }
    [data-theme="dark"] {
      --wp-bg: #0a0a0a;
      --wp-fg: #f4f4f5;
      --wp-muted: #a1a1aa;
      --wp-subtle: #71717a;
      --wp-border: #27272a;
      --wp-surface: #18181b;
      --wp-surface2: #27272a;
      --wp-surface3: #1c1c1f;
      --wp-accent: #fbbf24;
      --wp-accent2: #f59e0b;
      --wp-ring: rgba(251,191,36,0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--wp-bg);
      color: var(--wp-fg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    .wp-shell { max-width: 960px; margin: 0 auto; padding: 2.75rem 1.5rem 3rem; }
    .wp-app { display: flex; flex-direction: column; gap: 1.75rem; }
    .wp-header-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
    }
    .wp-brand {
      justify-self: start;
    }
    .wp-brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
    .wp-brand h1 a { color: inherit; text-decoration: none; }
    .wp-brand h1 span { font-weight: 300; color: var(--wp-subtle); }
    [data-theme="dark"] .wp-brand h1 span { color: var(--wp-muted); }
    .wp-nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-self: center; }
    .wp-nav-link {
      font-size: 13px; padding: 6px 12px; border-radius: 8px; color: var(--wp-muted); text-decoration: none;
      transition: background .12s, color .12s;
    }
    .wp-nav-link:hover { background: var(--wp-surface2); color: var(--wp-fg); }
    .wp-nav-link.wp-nav-active { background: var(--wp-surface2); color: var(--wp-accent); font-weight: 600; }
    .wp-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
    }
    .wp-theme-btn { flex-shrink: 0; }

    @media (max-width: 640px) {
      .wp-header-row {
        grid-template-columns: 1fr auto;
        gap: 12px 8px;
      }
      .wp-brand {
        grid-column: 1;
      }
      .wp-header-actions {
        grid-column: 2;
      }
      .wp-nav {
        grid-column: 1 / span 2;
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        border-top: 1px solid var(--wp-border);
        padding-top: 12px;
        margin-top: 4px;
        justify-self: stretch;
      }
      .wp-nav-link {
        text-align: center;
        padding: 6px 12px;
      }
    }
    #wp-main { min-height: 200px; }
    .wp-view-home {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 40rem;
      padding-top: 0.25rem;
    }
    .wp-home-hero { display: flex; flex-direction: column; gap: 0.75rem; }
    .wp-home-title {
      font-size: clamp(1.35rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--wp-fg);
    }
    .wp-home-lead {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
      color: var(--wp-muted);
      max-width: 36rem;
    }
    .wp-home-grid {
      display: grid;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .wp-home-grid { grid-template-columns: repeat(3, 1fr); }
      .wp-view-home { max-width: none; }
    }
    .wp-home-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.125rem 1.25rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--wp-border);
      background: var(--wp-surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .wp-home-card-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.35;
      color: var(--wp-fg);
    }
    .wp-home-card-body {
      margin: 0;
      flex: 1;
      font-size: 13px;
      line-height: 1.55;
      color: var(--wp-muted);
    }
    .wp-home-card-btn { align-self: flex-start; margin-top: 0.5rem; }
    .wp-home-hint {
      margin: 0;
      padding-top: 0.25rem;
      font-size: 13px;
      line-height: 1.55;
      color: var(--wp-muted);
      max-width: 36rem;
    }
    .wp-home-hint strong { color: var(--wp-fg); font-weight: 600; }
    .wp-view-docs .wp-shell-inner { max-width: 720px; }
    .wp-lead { font-size: 15px; line-height: 1.55; color: var(--wp-fg); margin-bottom: 1rem; }
    .wp-muted { font-size: 13px; color: var(--wp-muted); line-height: 1.5; margin-top: 1rem; }
    .wp-muted code { font-size: 12px; background: var(--wp-surface2); padding: 1px 5px; border-radius: 4px; }
    .wp-cta-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 1rem 0; }
    .wp-doc-h2 { font-size: 1.05rem; margin: 1.5rem 0 0.75rem; font-weight: 600; }
    .wp-doc-h3 { font-size: 0.95rem; margin: 1rem 0 0.5rem; font-weight: 600; color: var(--wp-muted); }
    .wp-code-block { position: relative; margin: 0.5rem 0 1rem; }
    .wp-code-block pre {
      margin: 0; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--wp-border);
      background: var(--wp-surface3); overflow-x: auto; font-size: 12px; line-height: 1.45;
    }
    .wp-code-block code { font-family: ui-monospace, SFMono-Regular, monospace; white-space: pre; }
    .wp-copy-btn { position: absolute; top: 8px; right: 8px; }
    .wp-doc-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0.5rem 0 1rem; }
    .wp-doc-table th, .wp-doc-table td {
      border: 1px solid var(--wp-border); padding: 8px 10px; text-align: left; vertical-align: top;
    }
    .wp-doc-table th { background: var(--wp-surface2); font-weight: 600; }
    .wp-doc-table code { font-size: 12px; background: transparent; }
    .wp-preview-layout {
      display: grid; grid-template-columns: minmax(200px, 260px) 1fr; gap: 16px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .wp-preview-layout { grid-template-columns: 1fr; }
    }
    .wp-preview-sidebar { display: flex; flex-direction: column; gap: 10px; }
    .wp-tag-list { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow-y: auto; }
    .wp-tag-pill {
      text-align: left; font-size: 12px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--wp-border); background: var(--wp-surface); color: var(--wp-fg);
      cursor: pointer; font-family: ui-monospace, monospace;
    }
    .wp-tag-pill:hover { background: var(--wp-surface2); }
    .wp-tag-pill.wp-tag-pill-active { border-color: var(--wp-accent2); color: var(--wp-accent); font-weight: 600; }
    .wp-preview-main { min-width: 0; }
    .wp-preview-headline { margin-bottom: 10px; }
    .wp-preview-title { font-size: 14px; }
    .wp-preview-host { margin-bottom: 1rem; }
    .wp-preview-panel { border: 1px solid var(--wp-border); border-radius: 12px; padding: 14px; background: var(--wp-surface); }
    .wp-preview-stage {
      min-height: 160px; padding: 16px; border-radius: 8px; border: 1px dashed var(--wp-border);
      background: var(--wp-surface3); display: flex; align-items: center; justify-content: center;
    }
    .wp-preview-stage--sandbox {
      display: block;
      align-items: unset;
      justify-content: unset;
    }
    .wp-snippet-section { margin-top: 0.5rem; }
    .wp-snippet-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--wp-subtle); margin-bottom: 6px; }
    .wp-snippet-hint { font-size: 12px; color: var(--wp-muted); line-height: 1.45; margin-bottom: 10px; }
    .wp-snippet-live-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .wp-snippet-live-label { font-size: 12px; color: var(--wp-fg); cursor: pointer; user-select: none; }
    .wp-snippet-live-row input { width: 16px; height: 16px; accent-color: var(--wp-accent2); cursor: pointer; }
    .wp-snippet-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .wp-snippet-editor-host { width: 100%; margin-bottom: 8px; }
    .wp-snippet-editor-wrap {
      border-radius: 8px; border: 1px solid var(--wp-border); overflow: hidden; min-height: 120px;
      background: var(--wp-surface);
    }
    .wp-snippet-editor-wrap .cm-editor { min-height: 120px; }
    .wp-snippet-editor-wrap .cm-editor.cm-focused { outline: none; }
    .wp-snippet-editor-wrap.wp-snippet-error { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,.25); }
    .wp-snippet-ta {
      width: 100%; min-height: 72px; padding: 10px; border-radius: 8px; border: 1px solid var(--wp-border);
      font-family: ui-monospace, monospace; font-size: 12px; background: var(--wp-surface); color: var(--wp-fg);
      resize: vertical; margin-bottom: 8px;
    }
    .wp-snippet-ta.wp-snippet-error { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,.25); }
    .wp-empty { text-align: center; padding: 2rem 1rem; color: var(--wp-subtle); }
    .wp-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    /* Icon + input share one grid cell so alignment never drifts (absolute + flex quirks). */
    .wp-search-wrap {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      flex: 1 1 200px;
      min-width: 0;
      min-height: 36px;
      max-width: 340px;
    }
    .wp-search-wrap--fill {
      width: 100%;
      max-width: none;
      flex: 1 1 auto;
    }
    .wp-search-icon {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
      align-self: center;
      margin-left: 10px;
      z-index: 1;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      color: var(--wp-subtle);
    }
    .wp-search-icon svg {
      display: block;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .wp-search-input {
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      min-width: 0;
      min-height: 36px;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--wp-border); border-radius: 8px;
      font-size: 13px; line-height: 1.35;
      background: var(--wp-surface); color: var(--wp-fg);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .wp-search-input::placeholder { color: var(--wp-subtle); }
    .wp-search-input:focus { border-color: var(--wp-accent2); box-shadow: 0 0 0 3px var(--wp-ring); }
    .wp-count { font-size: 12px; font-family: ui-monospace, monospace; color: var(--wp-subtle); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .wp-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--wp-border); background: var(--wp-surface);
      color: var(--wp-muted); cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s, border-color .15s;
      user-select: none; line-height: 1;
    }
    .wp-btn:hover { background: var(--wp-surface2); color: var(--wp-fg); }
    /* Primary CTA colors are set inline in home.ts (survives Tailwind preflight order). Hover only here. */
    button.wp-btn.wp-btn-primary:hover { filter: brightness(1.07); }
    [data-theme="dark"] .wp-cta-row .wp-btn:not(.wp-btn-primary) {
      color: #e4e4e7 !important;
      border-color: var(--wp-border);
      background-color: var(--wp-surface);
    }
    [data-theme="dark"] .wp-cta-row .wp-btn:not(.wp-btn-primary):hover {
      color: var(--wp-fg) !important;
      background-color: var(--wp-surface2);
    }
    .wp-btn svg { flex-shrink: 0; }
    .wp-list { display: flex; flex-direction: column; gap: 10px; }
    .wp-section {
      border: 1px solid var(--wp-border); border-radius: 12px;
      background: var(--wp-surface); overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      transition: background .2s, border-color .2s;
    }
    .wp-section-header {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; text-align: left;
      background: transparent; border: none; cursor: pointer;
      color: var(--wp-fg); font: inherit; user-select: none;
      transition: background .12s;
    }
    .wp-section-header:hover { background: var(--wp-surface2); }
    .wp-arrow { color: var(--wp-subtle); display: flex; flex-shrink: 0; transition: color .12s; }
    .wp-section-header:hover .wp-arrow { color: var(--wp-fg); }
    .wp-chevron { display: inline-flex; transition: transform .2s ease; }
    .wp-chevron.wp-open { transform: rotate(90deg); }
    .wp-tag {
      font-size: 13px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--wp-accent); background: var(--wp-surface2);
      padding: 2px 8px; border-radius: 5px;
    }
    .wp-prop-count { margin-left: auto; font-size: 11px; font-family: ui-monospace, monospace; color: var(--wp-subtle); }
    .wp-section-body { padding: 4px 18px 18px; border-top: 1px solid var(--wp-border); }
    .wp-props-panel {
      margin: 10px 0 14px; padding: 10px 12px;
      background: var(--wp-surface3); border-radius: 8px;
      border: 1px solid var(--wp-border);
    }
    .wp-props-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--wp-subtle); margin-bottom: 8px;
    }
    .wp-prop-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
    .wp-prop-name { font-family: ui-monospace, monospace; color: var(--wp-muted); min-width: 70px; }
    .wp-badge {
      font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
      background: var(--wp-surface2); color: var(--wp-subtle);
      padding: 1px 5px; border-radius: 4px;
    }
    .wp-checkbox { margin-left: auto; width: 16px; height: 16px; accent-color: var(--wp-accent2); cursor: pointer; }
    .wp-input {
      margin-left: auto; flex: 1; max-width: 200px;
      padding: 4px 8px; border: 1px solid var(--wp-border); border-radius: 6px;
      font-size: 13px; background: var(--wp-surface); color: var(--wp-fg);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .wp-input:focus { border-color: var(--wp-accent2); box-shadow: 0 0 0 2px var(--wp-ring); }
    .wp-mono { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="wp-shell">
    <div id="app"></div>
  </div>

  <script type="module" src="/src/playground/main.ts"></script>
</body>
</html>
